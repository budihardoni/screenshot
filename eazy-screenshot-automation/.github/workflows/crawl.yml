name: Eazy Screenshot Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: eazy-screenshot-automation/package.json

      - name: Install deps
        working-directory: eazy-screenshot-automation
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Auth setup (login & save session)
        working-directory: eazy-screenshot-automation
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DOSEN_USERNAME: ${{ secrets.DOSEN_USERNAME }}
          DOSEN_PASSWORD: ${{ secrets.DOSEN_PASSWORD }}
          MAHASISWA_USERNAME: ${{ secrets.MAHASISWA_USERNAME }}
          MAHASISWA_PASSWORD: ${{ secrets.MAHASISWA_PASSWORD }}
        run: npx playwright test --project=admin --grep "authenticate"

      - name: Crawl & screenshot (all roles)
        working-directory: eazy-screenshot-automation
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          npx playwright test --project=admin
          npx playwright test --project=mahasiswa || true
          npx playwright test --project=dosen || true

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            eazy-screenshot-automation/screenshots/
            eazy-screenshot-automation/playwright-report/
          retention-days: 30

      - name: Commit screenshots back to repo (optional)
        run: |
          git config user.name "screenshot-bot"
          git config user.email "bot@eazy.local"
          git add eazy-screenshot-automation/screenshots/ || true
          git diff --staged --quiet || git commit -m "chore: update screenshots [${{ github.run_number }}]"
          git push || echo "No push permission or no changes"
