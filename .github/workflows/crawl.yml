name: Eazy Screenshot Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: eazy-screenshot-automation
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Debug Secrets (check without exposing password)
        working-directory: eazy-screenshot-automation
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          echo "BASE_URL is set: $([ -n "$BASE_URL" ] && echo YES || echo NO)"
          echo "SUPERADMIN_USERNAME is set: $([ -n "$SUPERADMIN_USERNAME" ] && echo YES || echo NO)"
          echo "SUPERADMIN_PASSWORD is set: $([ -n "$SUPERADMIN_PASSWORD" ] && echo YES || echo NO)"
          echo "If any is NO, cek Settings > Secrets > Actions - nama harus exact: SUPERADMIN_USERNAME, SUPERADMIN_PASSWORD, BASE_URL"

      - name: Prepare storage folder
        run: |
          mkdir -p eazy-screenshot-automation/config
          echo '{"cookies":[],"origins":[]}' > eazy-screenshot-automation/config/storage-superadmin.json
          cat eazy-screenshot-automation/config/storage-superadmin.json

      - name: Auth setup (Super Admin login)

        working-directory: eazy-screenshot-automation
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: npx playwright test --project=super-admin -g "authenticate as super-admin"

      - name: Crawl & screenshot (Super Admin - all modules)
        working-directory: eazy-screenshot-automation
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          npx playwright test --project=super-admin

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            eazy-screenshot-automation/screenshots/
            eazy-screenshot-automation/playwright-report/
          retention-days: 30

      - name: Commit screenshots back to repo
        if: always()
        run: |
          git config user.name "screenshot-bot"
          git config user.email "bot@eazy.local"
          git add eazy-screenshot-automation/screenshots/ || true
          git diff --staged --quiet || git commit -m "chore: update screenshots [run ${{ github.run_number }}]"
          git push || echo "No changes to push"


